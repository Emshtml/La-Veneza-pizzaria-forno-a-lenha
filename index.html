<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>La Pizzaria Forno a Lenha</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <style>
        * {
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #fff7ed;
        }

        .banner {
            background-image:
                linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
                url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=1600');
            background-size: cover;
            background-position: center;
        }

        .scroll-hidden::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="text-gray-800">

    <!-- HERO -->
    <header class="banner min-h-[70vh] flex items-center justify-center">

        <div class="text-center px-6">

            <h1 class="text-5xl md:text-7xl font-extrabold text-orange-500 drop-shadow-2xl">
                🍕 La pizzaria forno a lenha 
            </h1>

            <h2 class="text-2xl md:text-4xl text-white font-bold mt-4">
                Pizzaria Forno a Lenha
            </h2>

            <p class="text-gray-200 mt-6 max-w-2xl mx-auto text-lg leading-relaxed">
                Pizzas artesanais feitas no forno a lenha com ingredientes
                selecionados e sabor incomparável.
            </p>

            <button
                onclick="document.getElementById('cardapio').scrollIntoView({behavior:'smooth'})"
                class="mt-8 bg-orange-500 hover:bg-orange-600 text-black font-bold px-8 py-4 rounded-2xl shadow-2xl transition-all active:scale-95"
            >
                VER CARDÁPIO
            </button>

        </div>

    </header>

    <!-- CARDÁPIO -->
    <section class="py-16 px-4">

        <div class="max-w-7xl mx-auto">

            <div class="text-center mb-12">

                <h2 class="text-4xl font-extrabold text-gray-900">
                    Nosso Cardápio
                </h2>

                <p class="text-gray-500 mt-3">
                    Escolha sua pizza favorita
                </p>

            </div>

            <div
                id="cardapio"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"
            ></div>

        </div>

    </section>

    <!-- BOTÃO FIXO CARRINHO -->
    <div class="fixed bottom-6 right-6 z-50">

        <button
            id="btn-ver-carrinho"
            class="bg-red-600 hover:bg-red-700 text-white px-6 py-4 rounded-full shadow-2xl flex items-center gap-3 transition-all active:scale-95"
        >

            <i class="fa-solid fa-cart-shopping text-xl"></i>

            <div class="text-left">
                <p class="text-xs">Carrinho</p>
                <span id="total-barra" class="font-bold">
                    R$ 0,00
                </span>
            </div>

            <span
                id="contador-carrinho"
                class="bg-white text-red-600 w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold"
            >
                0
            </span>

        </button>

    </div>

    <!-- MODAL -->
    <div
        id="modal-carrinho"
        class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4"
    >

        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden">

            <!-- TOPO -->
            <div class="bg-black text-white p-6 flex items-center justify-between">

                <div>
                    <h3 class="text-2xl font-extrabold">
                        Seu Pedido
                    </h3>

                    <p class="text-gray-300 text-sm">
                        La Veneza Pizzaria
                    </p>
                </div>

                <button
                    id="btn-fechar-modal"
                    class="text-white text-2xl hover:text-red-400"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>

            </div>

            <!-- ITENS -->
            <div
                id="itens-carrinho"
                class="p-6 max-h-[350px] overflow-y-auto scroll-hidden space-y-4"
            ></div>

            <!-- RODAPÉ -->
            <div class="border-t p-6 bg-orange-50">

                <div class="flex items-center justify-between mb-5">

                    <span class="text-lg font-bold">
                        Total:
                    </span>

                    <span
                        id="total-modal"
                        class="text-2xl font-extrabold text-orange-600"
                    >
                        R$ 0,00
                    </span>

                </div>

                <input
                    id="input-endereco"
                    type="text"
                    placeholder="Digite seu endereço..."
                    class="w-full border-2 border-gray-200 focus:border-orange-500 outline-none rounded-xl px-4 py-3"
                />

                <p
                    id="aviso-endereco"
                    class="hidden text-red-500 text-sm mt-2"
                >
                    Informe o endereço para entrega.
                </p>

                <button
                    id="btn-finalizar-pedido"
                    class="w-full mt-5 bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-95"
                >
                    <i class="fa-brands fa-whatsapp mr-2"></i>
                    Finalizar Pedido
                </button>

            </div>

        </div>

    </div>

    <script>

        const produtos = [
            {
                id: 1,
                nome: "Pizza Doce de Leite com Paçoca",
                descricao: "Doce de leite cremoso com paçoca crocante.",
                preco: 45.00,
                imagem: "https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=500"
            },

            {
                id: 2,
                nome: "Frango com Catupiry",
                descricao: "Frango artesanal com Catupiry original.",
                preco: 59.00,
                imagem: "https://images.unsplash.com/photo-1601924582970-9238bcb495d9?q=80&w=500"
            },

            {
                id: 3,
                nome: "Mussarela com Calabresa",
                descricao: "Mussarela premium e calabresa especial.",
                preco: 39.00,
                imagem: "https://images.unsplash.com/photo-1594007654729-407eedc4be65?q=80&w=500"
            },

            {
                id: 4,
                nome: "Marguerita",
                descricao: "Tomate, manjericão e queijo especial.",
                preco: 42.00,
                imagem: "https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?q=80&w=500"
            },

            {
                id: 5,
                nome: "Quatro Queijos",
                descricao: "Mistura perfeita de quatro queijos.",
                preco: 49.00,
                imagem: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?q=80&w=500"
            },

            {
                id: 6,
                nome: "Portuguesa",
                descricao: "Presunto, ovos, cebola e ervilha.",
                preco: 38.00,
                imagem: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?q=80&w=500"
            },

            {
                id: 7,
                nome: "Coca-Cola 2L",
                descricao: "Refrigerante Coca-Cola gelado.",
                preco: 15.00,
                imagem: "https://images.unsplash.com/photo-1554866585-cd94860890b7?q=80&w=500"
            },

            {
                id: 8,
                nome: "Guaraná Antarctica 2L",
                descricao: "Guaraná Antarctica 2 litros.",
                preco: 12.00,
                imagem: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?q=80&w=500"
            }
        ];

        let carrinho = [];

        const cardapioContainer =
            document.getElementById("cardapio");

        const modalCarrinho =
            document.getElementById("modal-carrinho");

        const btnVerCarrinho =
            document.getElementById("btn-ver-carrinho");

        const btnFecharModal =
            document.getElementById("btn-fechar-modal");

        const itensCarrinhoContainer =
            document.getElementById("itens-carrinho");

        const totalBarra =
            document.getElementById("total-barra");

        const totalModal =
            document.getElementById("total-modal");

        const contadorCarrinho =
            document.getElementById("contador-carrinho");

        const inputEndereco =
            document.getElementById("input-endereco");

        const avisoEndereco =
            document.getElementById("aviso-endereco");

        const btnFinalizarPedido =
            document.getElementById("btn-finalizar-pedido");

        function renderizarCardapio() {

            cardapioContainer.innerHTML = "";

            produtos.forEach(produto => {

                const div = document.createElement("div");

                div.className =
                    "bg-white rounded-3xl overflow-hidden shadow-lg hover:shadow-2xl transition-all border border-orange-100 flex flex-col";

                div.innerHTML = `
                    <img
                        src="${produto.imagem}"
                        alt="${produto.nome}"
                        class="w-full h-52 object-cover"
                    >

                    <div class="p-5 flex flex-col flex-1">

                        <h3 class="font-extrabold text-xl text-gray-900">
                            ${produto.nome}
                        </h3>

                        <p class="text-gray-500 text-sm mt-2 flex-1">
                            ${produto.descricao}
                        </p>

                        <div class="flex items-center justify-between mt-5">

                            <span class="text-2xl font-extrabold text-orange-600">
                                R$ ${produto.preco.toFixed(2).replace(".", ",")}
                            </span>

                            <button
                                class="bg-orange-500 hover:bg-orange-600 text-black font-bold px-4 py-3 rounded-xl shadow-lg btn-add"
                                data-id="${produto.id}"
                            >
                                <i class="fa-solid fa-plus"></i>
                            </button>

                        </div>

                    </div>
                `;

                cardapioContainer.appendChild(div);

            });

        }

        cardapioContainer.addEventListener("click", (e) => {

            const botao = e.target.closest(".btn-add");

            if (botao) {

                const id =
                    parseInt(botao.getAttribute("data-id"));

                adicionarAoCarrinho(id);

            }

        });

        function adicionarAoCarrinho(id) {

            const produto =
                produtos.find(p => p.id === id);

            const itemExistente =
                carrinho.find(item => item.id === id);

            if (itemExistente) {

                itemExistente.quantidade++;

            } else {

                carrinho.push({
                    ...produto,
                    quantidade: 1
                });

            }

            atualizarInterface();

        }

        function atualizarInterface() {

            let total = 0;
            let totalItens = 0;

            carrinho.forEach(item => {

                total += item.preco * item.quantidade;
                totalItens += item.quantidade;

            });

            totalBarra.textContent =
                `R$ ${total.toFixed(2).replace(".", ",")}`;

            totalModal.textContent =
                `R$ ${total.toFixed(2).replace(".", ",")}`;

            contadorCarrinho.textContent =
                totalItens;

        }

        btnVerCarrinho.addEventListener("click", () => {

            renderizarCarrinhoModal();

            modalCarrinho.classList.remove("hidden");

        });

        btnFecharModal.addEventListener("click", () => {

            modalCarrinho.classList.add("hidden");

        });

        modalCarrinho.addEventListener("click", (e) => {

            if (e.target === modalCarrinho) {

                modalCarrinho.classList.add("hidden");

            }

        });

        function renderizarCarrinhoModal() {

            itensCarrinhoContainer.innerHTML = "";

            if (carrinho.length === 0) {

                itensCarrinhoContainer.innerHTML = `
                    <p class="text-center text-gray-500">
                        Seu carrinho está vazio.
                    </p>
                `;

                return;

            }

            carrinho.forEach(item => {

                const div = document.createElement("div");

                div.className =
                    "bg-orange-50 rounded-2xl p-4 flex items-center justify-between";

                div.innerHTML = `
                    <div>

                        <h4 class="font-bold text-sm">
                            ${item.nome}
                        </h4>

                        <span class="text-gray-500 text-xs">
                            R$ ${item.preco.toFixed(2).replace(".", ",")}
                        </span>

                    </div>

                    <div class="flex items-center gap-3">

                        <button
                            class="text-red-500 font-bold btn-diminuir"
                            data-id="${item.id}"
                        >
                            -
                        </button>

                        <span class="font-bold">
                            ${item.quantidade}
                        </span>

                        <button
                            class="text-green-500 font-bold btn-aumentar"
                            data-id="${item.id}"
                        >
                            +
                        </button>

                    </div>
                `;

                itensCarrinhoContainer.appendChild(div);

            });

        }

        itensCarrinhoContainer.addEventListener("click", (e) => {

            if (e.target.classList.contains("btn-aumentar")) {

                const id =
                    parseInt(e.target.getAttribute("data-id"));

                const item =
                    carrinho.find(i => i.id === id);

                item.quantidade++;

            }

            if (e.target.classList.contains("btn-diminuir")) {

                const id =
                    parseInt(e.target.getAttribute("data-id"));

                const idx =
                    carrinho.findIndex(i => i.id === id);

                if (carrinho[idx].quantidade > 1) {

                    carrinho[idx].quantidade--;

                } else {

                    carrinho.splice(idx, 1);

                }

            }

            atualizarInterface();
            renderizarCarrinhoModal();

        });

        btnFinalizarPedido.addEventListener("click", () => {

            if (carrinho.length === 0) {

                alert("Seu carrinho está vazio!");
                return;

            }

            if (inputEndereco.value.trim() === "") {

                avisoEndereco.classList.remove("hidden");

                return;

            }

            avisoEndereco.classList.add("hidden");

            let mensagem =
                `🍕 *LA VENEZA PIZZARIA FORNO A LENHA* 🍕\n\n`;

            carrinho.forEach(item => {

                mensagem +=
                    `• ${item.quantidade}x ${item.nome} - R$ ${(item.preco * item.quantidade).toFixed(2)}\n`;

            });

            const total =
                carrinho.reduce((acc, item) => {
                    return acc + item.preco * item.quantidade;
                }, 0);

            mensagem +=
                `\n💰 *Total:* R$ ${total.toFixed(2)}`;

            mensagem +=
                `\n📍 *Endereço:* ${inputEndereco.value}`;

            const telefone = "5511976794749";

            const url =
                `https://api.whatsapp.com/send?phone=${telefone}&text=${encodeURIComponent(mensagem)}`;

            window.open(url, "_blank");

        });

        renderizarCardapio();

    </script>

</body>
</html>
